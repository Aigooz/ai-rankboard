<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI 排行榜</title>
  <meta name="description" content="跨源聚合 AI 模型榜单，支持能力、价格、趋势和场景选型对比。">
  <meta name="color-scheme" content="light">
  <meta property="og:title" content="AI 排行榜">
  <meta property="og:description" content="跨源聚合 AI 模型榜单，支持能力、价格、趋势和场景选型对比。">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="app-header">
    <div class="shell header-inner">
      <a class="brand" href="#/">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20V8"/><path d="M9 20V4"/><path d="M15 20v-7"/><path d="M21 20v-10"/></svg>
        </span>
        <span>
          <span class="brand-name">AI 排行榜</span>
          <small>模型能力 · 价格 · 趋势</small>
        </span>
      </a>
      <nav class="app-nav" aria-label="主导航">
        <a href="#/" data-view="leaderboard">排行榜</a>
        <a href="#/trends" data-view="trends">趋势</a>
        <a href="#/select" data-view="select">选型</a>
      </nav>
      <div class="header-actions">
        <a class="icon-button" href="https://github.com/Aigooz/ai-rankboard" target="_blank" rel="noreferrer" aria-label="GitHub 仓库">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2C6.48 2 2 6.48 2 12c0 4.42 2.87 8.17 6.84 9.5.5.08.66-.22.66-.48v-1.7c-2.78.61-3.37-1.34-3.37-1.34-.45-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.9 1.53 2.36 1.09 2.93.83.09-.65.35-1.09.64-1.34-2.22-.25-4.55-1.11-4.55-4.94 0-1.09.39-1.98 1.03-2.68-.1-.25-.45-1.27.1-2.64 0 0 .84-.27 2.75 1.02.8-.22 1.65-.33 2.5-.33.85 0 1.7.11 2.5.33 1.91-1.29 2.75-1.02 2.75-1.02.55 1.37.2 2.39.1 2.64.64.7 1.03 1.59 1.03 2.68 0 3.84-2.34 4.68-4.57 4.93.36.31.68.92.68 1.85V21c0 .27.16.57.67.48A10.01 10.01 0 0 0 22 12c0-5.52-4.48-10-10-10Z"/></svg>
        </a>
        <a class="download-button" href="https://raw.githubusercontent.com/Aigooz/ai-rankboard-updates/main/app-release.apk" download>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 11 5 5 5-5"/><path d="M5 21h14"/></svg>
          <span>Android</span>
        </a>
      </div>
    </div>
  </header>

  <main class="shell page" id="app" aria-live="polite">
    <section class="loading-state" id="loading">
      <span class="spinner"></span>
      <h1>正在加载榜单</h1>
      <p>正在获取最新快照数据，首次加载可能需要几秒。</p>
    </section>
  </main>

  <div class="modal" id="model-modal" hidden>
    <div class="modal-backdrop" data-close-modal></div>
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-header">
        <h2 id="modal-title">模型详情</h2>
        <button class="icon-button" type="button" data-close-modal aria-label="关闭详情">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      <div class="modal-body" id="modal-content"></div>
    </div>
  </div>

  <footer class="app-footer">
    <div class="shell footer-inner">
      <span id="data-meta">数据加载中</span>
      <a href="https://github.com/Aigooz/ai-rankboard" target="_blank" rel="noreferrer">开放仓库</a>
    </div>
  </footer>

  <script type="module" src="./app.js"></script>
</body>
</html>
