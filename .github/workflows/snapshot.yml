name: Snapshot

on:
  schedule:
    # Hourly target; avoid the busy top of the hour. Actions may still be delayed.
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - name: Refresh sources and export snapshot
        working-directory: backend
        run: python -m app.publish ../leaderboards.json
      - name: Commit snapshot to the main repository
        run: |
          cp leaderboards.json web/leaderboards.json
          cp leaderboards.json.sha256 web/leaderboards.json.sha256
          cp leaderboards.json android/app/src/main/assets/leaderboards.json
          cp leaderboards.json.sha256 android/app/src/main/assets/leaderboards.json.sha256
          cp leaderboards.json ios/Source/Resources/leaderboards.json
          cp leaderboards.json.sha256 ios/Source/Resources/leaderboards.json.sha256
          git config user.name "snapshot-bot"
          git config user.email "ai-rankboard@local"
          SNAPSHOT_FILES="leaderboards.json leaderboards.json.sha256 web/leaderboards.json web/leaderboards.json.sha256 android/app/src/main/assets/leaderboards.json android/app/src/main/assets/leaderboards.json.sha256 ios/Source/Resources/leaderboards.json ios/Source/Resources/leaderboards.json.sha256"
          if [ -n "$(git status --porcelain -- $SNAPSHOT_FILES)" ]; then
            git add $SNAPSHOT_FILES
            git commit -m "chore: refresh leaderboard snapshot"
            git push origin HEAD:main
          else
            echo "snapshot unchanged"
          fi
