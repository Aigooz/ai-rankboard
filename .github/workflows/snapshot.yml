name: Snapshot

on:
  schedule:
    # UTC 1/7/13/19 点，即北京时间 9/15/21/3 点，与后端抓取节奏一致
    - cron: '0 1,7,13,19 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - name: Refresh sources and export snapshot
        working-directory: backend
        run: python -m app.publish ../snapshot/leaderboards.json
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain snapshot/)" ]; then
            git config user.name "snapshot-bot"
            git config user.email "ai-rankboard@local"
            git add snapshot/
            git commit -m "chore: refresh leaderboard snapshot"
            git push
          else
            echo "snapshot unchanged"
          fi
