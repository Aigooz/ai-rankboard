name: Snapshot

on:
  schedule:
    # UTC 1/7/13/19 点，即北京时间 9/15/21/3 点，与后端抓取节奏一致
    - cron: '0 1,7,13,19 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - name: Refresh sources and export snapshot
        working-directory: backend
        run: python -m app.publish ../snapshot/leaderboards.json
      # 主仓库是私有的，公开更新仓库 ai-rankboard-updates 需要凭据才能推送：
      # 在本仓库 Settings → Secrets and variables → Actions 配置 SNAPSHOT_TOKEN
      # （对 ai-rankboard-updates 有 contents:write 权限的 PAT）。
      - name: Publish to public updates repo
        env:
          TOKEN: ${{ secrets.SNAPSHOT_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "SNAPSHOT_TOKEN 未配置，跳过发布；可本地运行 backend/app/publish.py 后手动推送。"
            exit 0
          fi
          git clone --depth 1 "https://x-access-token:$TOKEN@github.com/Aigooz/ai-rankboard-updates.git" publish
          cp snapshot/leaderboards.json snapshot/leaderboards.json.sha256 publish/
          cd publish
          git config user.name "snapshot-bot"
          git config user.email "ai-rankboard@local"
          if [ -n "$(git status --porcelain)" ]; then
            git add leaderboards.json leaderboards.json.sha256
            git commit -m "chore: refresh leaderboard snapshot"
            git push
          else
            echo "snapshot unchanged"
          fi
