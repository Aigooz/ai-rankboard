name: AI Rankboard
options:
  bundleIdPrefix: com.ai
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  AI Rankboard:
    type: application
    platform: iOS
    sources:
      - path: Source
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ai.rankboard
        MARKETING_VERSION: 0.14.1
        CURRENT_PROJECT_VERSION: 35
        SWIFT_VERSION: 5.9
        INFOPLIST_FILE: Source/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: YES

schemes:
  AI Rankboard:
    build:
      targets:
        AI Rankboard: all
    run:
      config: Debug
    archive:
      config: Release
